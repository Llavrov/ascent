<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Восхождение</title>
<style>
  html, body { margin: 0; height: 100%; background: #70767d; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center;
    padding: 0 8px calc(8px + env(safe-area-inset-bottom));
    font: 500 12px/1 system-ui, -apple-system, sans-serif; letter-spacing: .03em; text-transform: uppercase;
  }
  button {
    all: unset; box-sizing: border-box; min-height: 44px; padding: 0 6px; display: flex; align-items: center; gap: .4em;
    color: rgba(255, 255, 255, .6); text-shadow: 0 1px 6px rgba(0, 0, 0, .5); cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  button b { font-weight: 500; color: #fff; }
  button:active { color: #fff; }
  button:focus-visible { outline: 1px solid rgba(255, 255, 255, .8); outline-offset: -8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<nav>
  <button id="weather">Погода <b>Авто</b></button>
  <button id="camera">Камера <b>Авто</b></button>
  <button id="avalanche">Обвал</button>
  <button id="sound">Звук <b>Выкл</b></button>
</nav>
<script type="module" src="/src/main.js"></script>
</body>
</html>
