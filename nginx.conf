server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json application/wasm application/octet-stream; # последнее: модели glb
  # у файлов сборки в имени отпечаток содержимого: их можно держать в кеше вечно
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  # модели, текстуры и голос лежат под постоянными именами: кеш на час, чтобы правки доезжали
  location / { add_header Cache-Control "public, max-age=3600"; try_files $uri $uri/ =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }
}
